name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        # No floating v8 major tag published; pin the exact release.
        uses: astral-sh/setup-uv@v8.2.0

      - name: Verify release version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          with pathlib.Path("pyproject.toml").open("rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]

          init_text = pathlib.Path(
              "strawberry_django_aggregates/__init__.py"
          ).read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.M)
          package_version = match.group(1) if match else None

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(r"^## \[([^\]]+)\] — (\d{4}-\d{2}-\d{2})\b", changelog, re.M)
          top = re.search(r"^## .*$", changelog, re.M)

          versions = {
              "tag": expected,
              "pyproject.toml": project_version,
              "__init__.py": package_version,
              "CHANGELOG.md": heading.group(1) if heading else None,
          }
          if len(set(versions.values())) != 1:
              for name, version in versions.items():
                  print(f"{name}: {version}")
              print("Release versions must match.")
              sys.exit(1)
          if top is None or heading is None or top.start() != heading.start():
              print("The changelog's top entry must be headed with the release version and a date.")
              sys.exit(1)
          PY

      - name: Run the CI checks
        run: |
          uv sync --all-extras --group dev
          uv run ruff check .
          uv run mypy strawberry_django_aggregates/
          uv run pytest

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          # Token (password) auth disables Trusted Publishing, so the default
          # attestations=true is ignored; set it false explicitly to keep the
          # PYPI_TOKEN flow warning-free.
          attestations: false
